<!DOCTYPE html>
<html>
<head>
    <title>Add Teacher - Part 3</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f0f4f8; }
        h1 { color: #2c3e50; }
        form { background: white; padding: 30px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn-submit { background: #e74c3c; color: white; }
        .btn-cancel { background: #ccc; color: #333; margin-left: 10px; }
        .flash { padding: 15px; margin: 15px 0; border-radius: 4px; }
        .flash.success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <h1>Add New Teacher</h1>

    <nav>
        <a href="{{ url_for('index') }}">Students</a>
        <a href="{{ url_for('courses') }}">Courses</a>
        <a href="{{ url_for('teachers') }}">Teachers</a>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="e.g., Dr. John Smith">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="e.g., john.smith@school.edu">

        <button type="submit" class="btn btn-submit">Add Teacher</button>
        <a href="{{ url_for('teachers') }}" class="btn btn-cancel">Cancel</a>
    </form>
</body>
</html>
