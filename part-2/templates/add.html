<form method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" 
           value="{{ name if name else '' }}" 
           required placeholder="Enter student name">
    
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" 
           value="{{ email if email else '' }}" 
           required placeholder="Enter email address">
    
    <label for="course">Course:</label>
    <input type="text" id="course" name="course" 
           value="{{ course if course else '' }}" 
           required placeholder="Enter course name">
    
    <button type="submit" class="btn btn-submit">Add Student</button>
    <a href="{{ url_for('index') }}" class="btn btn-cancel">Cancel</a>
</form>
